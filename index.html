<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <title>现场投票 Live Poll</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      padding: 20px 18px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: #fff;
    }
    .container { max-width: 520px; margin: 0 auto; }
    .head {
      text-align: center;
      padding: 8px 0 24px;
    }
    .head h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: 1px;
    }
    .head p {
      margin: 0;
      font-size: 13px;
      opacity: 0.85;
    }
    .question {
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 22px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .q-tag {
      display: inline-block;
      background: #fbbf24;
      color: #78350f;
      font-weight: 700;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .q-title-zh {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.45;
    }
    .q-title-en {
      font-size: 12.5px;
      opacity: 0.82;
      margin-bottom: 18px;
      line-height: 1.45;
    }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      background: rgba(255,255,255,0.96);
      color: #1f2937;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: inherit;
      width: 100%;
    }
    .option:active { transform: scale(0.97); }
    .option.selected {
      background: #10b981;
      color: #fff;
      border-color: #fff;
    }
    .option.disabled { opacity: 0.55; pointer-events: none; }
    .badge {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #6366f1;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
    }
    .option.selected .badge { background: #fff; color: #10b981; }
    .opt-text { flex: 1; line-height: 1.25; }
    .opt-zh { font-size: 16px; font-weight: 600; }
    .opt-en { font-size: 12px; opacity: 0.7; margin-top: 2px; }
    .option.selected .opt-en { opacity: 0.9; }
    .check {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      color: #10b981;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }
    .option.selected .check { display: flex; }

    /* Tentative selection: highlighted but not yet submitted */
    .option.pending {
      background: #fef3c7;
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.35);
    }
    .option.pending .badge { background: #f59e0b; }

    /* Confirm submit button per question */
    .submit-btn {
      margin-top: 14px;
      width: 100%;
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.55);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
    }
    .submit-btn:active { transform: scale(0.97); }
    .submit-btn.ready {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 8px 28px rgba(16, 185, 129, 0.45);
    }
    .submit-btn.disabled { pointer-events: none; }
    .submit-btn.submitted {
      background: rgba(16, 185, 129, 0.25);
      color: #d1fae5;
      border-color: rgba(16,185,129,0.5);
      box-shadow: none;
    }
    .status {
      text-align: center;
      margin: 10px 0 0;
      font-size: 14px;
      opacity: 0.95;
      min-height: 22px;
      transition: opacity 0.3s;
    }
    .status.ok { color: #d1fae5; font-weight: 600; }
    .status.err { color: #fecaca; }
    .footer {
      text-align: center;
      font-size: 11px;
      opacity: 0.55;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="head">
      <h1>现场实时投票</h1>
      <p>Live Poll · 选好后点"确认提交" Tap option, then submit</p>
    </div>

    <div class="question" data-q="q1">
      <span class="q-tag">Q1</span>
      <div class="q-title-zh">您是否了解智能（物联网）照明产品？</div>
      <div class="q-title-en">Are you familiar with IoT-enabled smart lighting products?</div>
      <div class="options">
        <button class="option" data-opt="A">
          <span class="badge">A</span>
          <span class="opt-text">
            <div class="opt-zh">不了解</div>
            <div class="opt-en">Unaware</div>
          </span>
          <span class="check">✓</span>
        </button>
        <button class="option" data-opt="B">
          <span class="badge">B</span>
          <span class="opt-text">
            <div class="opt-zh">略有了解</div>
            <div class="opt-en">Somewhat familiar</div>
          </span>
          <span class="check">✓</span>
        </button>
        <button class="option" data-opt="C">
          <span class="badge">C</span>
          <span class="opt-text">
            <div class="opt-zh">十分了解</div>
            <div class="opt-en">Well-versed</div>
          </span>
          <span class="check">✓</span>
        </button>
      </div>
      <button class="submit-btn disabled" data-submit="q1">确认提交 Submit</button>
    </div>

    <div class="question" data-q="q2">
      <span class="q-tag">Q2</span>
      <div class="q-title-zh">结合节能 ESG 效益，您愿意为智能（物联网）灯具额外付费吗？</div>
      <div class="q-title-en">In view of energy conservation and ESG benefits, would you pay a premium for IoT smart luminaires?</div>
      <div class="options">
        <button class="option" data-opt="A">
          <span class="badge">A</span>
          <span class="opt-text">
            <div class="opt-zh">不愿意</div>
            <div class="opt-en">Unwilling</div>
          </span>
          <span class="check">✓</span>
        </button>
        <button class="option" data-opt="B">
          <span class="badge">B</span>
          <span class="opt-text">
            <div class="opt-zh">愿意</div>
            <div class="opt-en">Willing</div>
          </span>
          <span class="check">✓</span>
        </button>
      </div>
      <button class="submit-btn disabled" data-submit="q2">确认提交 Submit</button>
    </div>

    <div class="status" id="status">先选择，再点"确认提交"</div>
    <div class="footer">数据匿名 · 仅用于现场展示</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    const status = document.getElementById('status');
    const pending = { q1: null, q2: null };

    function setStatus(text, cls) {
      status.textContent = text;
      status.className = 'status' + (cls ? ' ' + cls : '');
    }

    const isSubmitted = q => !!localStorage.getItem('voted_' + q);
    const $block      = q => document.querySelector(`.question[data-q="${q}"]`);
    const $submitBtn  = q => document.querySelector(`.submit-btn[data-submit="${q}"]`);

    function highlightPending(q, opt) {
      $block(q).querySelectorAll('.option').forEach(b => {
        b.classList.toggle('pending', b.dataset.opt === opt);
      });
    }

    function markSubmitted(q, opt) {
      $block(q).querySelectorAll('.option').forEach(b => {
        b.classList.remove('pending');
        b.classList.add('disabled');
        if (b.dataset.opt === opt) b.classList.add('selected');
      });
      const btn = $submitBtn(q);
      btn.classList.remove('ready');
      btn.classList.add('submitted', 'disabled');
      btn.textContent = '已提交 ✓ Submitted';
    }

    function syncSubmitBtn(q) {
      if (isSubmitted(q)) return;
      const btn = $submitBtn(q);
      if (pending[q]) {
        btn.classList.remove('disabled');
        btn.classList.add('ready');
      } else {
        btn.classList.add('disabled');
        btn.classList.remove('ready');
      }
    }

    function refreshStatus() {
      const a = isSubmitted('q1'), b = isSubmitted('q2');
      if (a && b)       setStatus('感谢参与！Thanks for voting ✓', 'ok');
      else if (a || b)  setStatus('已提交一题，请继续 / Continue', 'ok');
      else              setStatus('先选择，再点"确认提交"');
    }

    function restore() {
      ['q1', 'q2'].forEach(q => {
        const v = localStorage.getItem('voted_' + q);
        if (v) markSubmitted(q, v);
      });
      refreshStatus();
    }

    // Tap an option → tentative selection (can change before submit)
    document.querySelectorAll('.question').forEach(block => {
      const q = block.dataset.q;
      block.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          if (isSubmitted(q)) return;
          pending[q] = btn.dataset.opt;
          highlightPending(q, pending[q]);
          syncSubmitBtn(q);
        });
      });
    });

    // Tap "确认提交" → actually send the vote
    document.querySelectorAll('.submit-btn').forEach(btn => {
      const q = btn.dataset.submit;
      btn.addEventListener('click', async () => {
        if (isSubmitted(q) || !pending[q]) return;
        const opt = pending[q];
        btn.classList.add('disabled');
        btn.textContent = '提交中... Submitting...';
        setStatus('提交中... Submitting...');
        try {
          const { error } = await sb.rpc('increment_vote', { qid: q, opt: opt });
          if (error) throw error;
          localStorage.setItem('voted_' + q, opt);
          markSubmitted(q, opt);
          refreshStatus();
        } catch (e) {
          btn.classList.remove('disabled');
          btn.textContent = '确认提交 Submit';
          setStatus('提交失败，请重试 Failed: ' + (e.message || e), 'err');
        }
      });
    });

    restore();
  </script>
</body>
</html>
